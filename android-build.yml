name: Android CI/CD - Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Decode Keystore
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo $ENCODED_STRING | base64 -di > android/app/keystore.jks
        else
          echo "No keystore found, will build debug APK"
        fi
        
    - name: Build Debug APK
      if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Build Release APK
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        if [ -f app/keystore.jks ]; then
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace --no-daemon
        else
          echo "Building unsigned release APK"
          ./gradlew assembleRelease --stacktrace --no-daemon
        fi
        
    - name: Upload Debug APK
      if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/*.apk
        
    - name: Upload Release APK
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/*.apk
        
    - name: Get version from tag
      if: startsWith(github.ref, 'refs/tags/')
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## XZY AI Assistant - Release ${{ steps.get_version.outputs.VERSION }}
          
          ### Download
          - **app-release.apk**: Production release (signed)
          - **app-debug.apk**: Debug build for testing
          
          ### Installation
          1. Download the APK file
          2. Enable "Install from Unknown Sources" on your Android device
          3. Open the APK file to install
          
          ### What's Changed
          See the full changelog below.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  lint:
    name: Run Android Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Run Lint
      run: |
        cd android
        ./gradlew lint --no-daemon
        
    - name: Upload Lint Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: lint-report
        path: android/app/build/reports/lint-results*.html
